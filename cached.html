<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shipping Documents Viewer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .doc-card {
            background: white;
            border-radius: 20px;
            margin-bottom: 25px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .doc-header {
            background: #f8f9fc;
            padding: 18px 25px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .doc-title { font-size: 1.2rem; font-weight: 700; color: #1e3c72; }
        .doc-meta { font-size: 12px; color: #6c757d; }
        .doc-content {
            padding: 25px;
            background: #fff;
            overflow-x: auto;
        }
        .no-docs {
            text-align: center;
            padding: 50px;
            background: white;
            border-radius: 20px;
            color: #6c757d;
        }
        @media (max-width: 768px) {
            body { padding: 20px 10px; }
            .doc-header { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
<div class="container">
            <div class="no-docs">
            <i class="fas fa-info-circle" style="font-size: 48px; margin-bottom: 15px;"></i>
            <p>No documents available.</p>
        </div>
    </div>
</body>
</html><!-- Last sync: Thu Oct  1 06:33:16 UTC 2026 -->
