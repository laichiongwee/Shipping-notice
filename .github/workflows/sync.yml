name: Sync from local server

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch content from local server
        run: |
          curl -s --max-time 30 "http://rajangport.ddns.net:8080/Mantis/Traffic/embed.php" > cached.html || echo '<p>Error fetching content. Please try again later.</p>' > cached.html
          echo "<!-- Last sync: $(date -u) -->" >> cached.html

      - name: Commit and push if changed
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add cached.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-sync at $(date -u)"
            git push
          fi
