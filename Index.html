<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vessels Schedule – Mirror</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .info {
            background: #e9ecef;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 0.9em;
            text-align: center;
        }
        iframe {
            width: 100%;
            border: none;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="info">
        ⏱️ Content synced every 15 minutes from the official shipping information system.
        <br>Last update: <span id="timestamp">loading...</span>
    </div>
    <div id="content">
        <iframe srcdoc="" style="height: 600px;"></iframe>
    </div>
</div>
    <!-- Sync Now button section -->
<div style="text-align: center; margin: 20px 0;">
    <button id="syncNowBtn" style="background-color: #28a745; color: white; border: none; padding: 10px 24px; border-radius: 30px; font-weight: bold; cursor: pointer;">
        🔄 Sync Now (Manual)
    </button>
    <span id="syncStatus" style="margin-left: 15px; font-size: 14px; color: #666;"></span>
</div>

<script>
    (function() {
        const syncBtn = document.getElementById('syncNowBtn');
        const statusSpan = document.getElementById('syncStatus');
        const REPO_OWNER = 'YOUR_GITHUB_USERNAME';      // Replace with your GitHub username
        const REPO_NAME = 'YOUR_REPO_NAME';            // Replace with your repository name
        const WORKFLOW_FILENAME = 'sync.yml';          // The workflow file name

        syncBtn.addEventListener('click', async () => {
            // Retrieve GitHub token from localStorage or prompt
            let token = localStorage.getItem('github_sync_token');
            if (!token) {
                token = prompt('Enter your GitHub Personal Access Token (classic) with "repo" scope:\n\nCreate one at https://github.com/settings/tokens');
                if (!token) return;
                localStorage.setItem('github_sync_token', token);
            }

            statusSpan.innerHTML = '⏳ Triggering sync...';
            syncBtn.disabled = true;

            try {
                const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/workflows/${WORKFLOW_FILENAME}/dispatches`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ ref: 'main' })   // your default branch
                });

                if (response.ok) {
                    statusSpan.innerHTML = '✅ Sync triggered! The page will reload in 30 seconds.';
                    // Reload after 30 seconds to show updated cached.html
                    setTimeout(() => {
                        location.reload();
                    }, 30000);
                } else {
                    const errorData = await response.json();
                    let errorMsg = errorData.message || 'Unknown error';
                    if (response.status === 401 || response.status === 403) {
                        errorMsg = 'Invalid or insufficient token. Please clear the token and try again.';
                        localStorage.removeItem('github_sync_token');
                    }
                    statusSpan.innerHTML = `❌ Failed: ${errorMsg}`;
                }
            } catch (err) {
                statusSpan.innerHTML = `❌ Network error: ${err.message}`;
            } finally {
                syncBtn.disabled = false;
            }
        });

        // Optional: Provide a way to clear the stored token (if needed)
        // You can add a small link: <a href="#" id="clearToken">(clear token)</a>
        const clearLink = document.getElementById('clearToken');
        if (clearLink) {
            clearLink.addEventListener('click', (e) => {
                e.preventDefault();
                localStorage.removeItem('github_sync_token');
                statusSpan.innerHTML = 'Token cleared. You will be prompted again on next sync.';
            });
        }
    })();
</script>
<script>
    // Fetch the cached HTML file and insert into iframe
    fetch('cached.html')
        .then(response => response.text())
        .then(html => {
            // Extract timestamp comment if present
            const match = html.match(/<!-- Last sync: (.*) -->/);
            if (match) {
                document.getElementById('timestamp').innerText = match[1];
                // Remove the comment from the html to avoid displaying it
                html = html.replace(/<!-- Last sync: .* -->/, '');
            } else {
                document.getElementById('timestamp').innerText = 'unknown';
            }
            const iframe = document.querySelector('iframe');
            iframe.srcdoc = html;
            // Resize iframe based on content (optional)
            iframe.onload = function() {
                iframe.style.height = iframe.contentWindow.document.documentElement.scrollHeight + 'px';
            };
        })
        .catch(err => {
            document.getElementById('content').innerHTML = '<p>Error loading content. Please try again later.</p>';
            console.error(err);
        });
</script>
</body>
</html>
